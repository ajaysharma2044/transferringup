headersOrigin = "config"
plugins = []

[build]
edge_functions = "/Users/ajaysharma/Downloads/project 31/netlify/edge-functions"
publish = "/Users/ajaysharma/Downloads/project 31/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"

[build.environment]
NODE_VERSION = "20"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/portal"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/portal/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/submit-review"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/*.webp"

[headers.values]
Cache-Control = "public, max-age=31536000"

[[headers]]
for = "/*.mp4"

[headers.values]
Cache-Control = "public, max-age=31536000"

[[headers]]
for = "/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpg"

[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/*.jpeg"

[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/*.png"

[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/*.svg"

[headers.values]
Cache-Control = "public, max-age=2592000"

[[redirects]]
from = "/portal/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/submit-review"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]